# Hugo site config

baseURL = "https://warwickhack.co.uk/"
languageCode = "en-gb"
timeZone = "Europe/London"
title = "WHACK"

# We don't use these page types
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[markup.goldmark.renderer]
unsafe = true

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    excludeFiles = "/img/organisers/**"

  [[module.mounts]]
    source = "static/img/organisers"
    target = "assets/img/organisers"
