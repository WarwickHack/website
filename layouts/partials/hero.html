<script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>

{{/* HERO
     Full-height opener: WHACK <event number>, title-sponsor slot,
     date + location, countdown/status banner, tickets + learn-more buttons.
     Reads: data/site.yaml (and sponsors.yaml for the title sponsor). */}}
<section class="hero" id="top">
     <img src="{{ "img/hero.png" | relURL }}" alt="A room of people coding">

     <div>
          <!-- {{ partial "logo.html" . }} -->
          <span class="logo" id="typewriter"></span>

          <h1>HACKATHON</h1>

          <h3>
               <span>{{ hugo.Data.site.date_text }}</span>
               <svg width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.501953" y="4.5" width="6" height="6" rx="1" transform="rotate(-45 0.501953 4.5)" /></svg>
               <span>{{ hugo.Data.site.location }}</span>
          </h3>
     </div>
</section>

<script>
     const container = document.getElementById('typewriter');

     const finalText = '<WHACK>';
     container.textContent = finalText;
     container.style.display = 'inline-block';
     container.style.width = container.getBoundingClientRect().width + 'px';
     container.textContent = '';

     const typewriter = new Typewriter(container, {
          loop: false,
          delay: 300,
     });
     typewriter
     .typeString('<')
     .typeString('WHACK')
     .typeString('>').start();
</script>
