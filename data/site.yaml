# Core event settings: the headline details that change each year
#
# Expected keys (fill in):
#   event_number      – e.g. 26
#   date_text         – human-readable date string for the hero
#   location          – venue / campus
#   starts_at         – ISO datetime, hacking start (drives the countdown)
#   ends_at           – ISO datetime, hacking end
#   title_sponsor_id  – id of a sponsor in sponsors.yaml, or "" for none
#   tickets           – label / url / state (enabled | disabled | soldout)
#   event_live        – true during the event to reveal the live page link
#   socials           – email / instagram / linkedin / discord (should optionally not be included)

event_number: 26
date_text: "7th - 8th November"
location: "The Oculus Building"
starts_at:        # pending schedule
ends_at:          # pending schedule
title_sponsor_id: # Pending info
tickets:
  label: ""
  url:   ""
  state: disabled
event_live: false
socials:
  email:     mailto:contact@warwickhack.co.uk
  instagram: https://www.instagram.com/warwickhacks/
  linkedin:  https://www.linkedin.com/company/warwickhacks/
  # Add when server is ready
  # discord:   ""

about:
  - heading: 'WAIT, <span class="gradiented">WHACK?</span>'
    image: a
    body: |
      **Warwick's flagship on-campus hackathon is back for 2025!**

      Following a huge success with the first ever WHACK last year, we're working
      hard to make it even better &mdash; and are now opening our doors to <span class="gradiented">**ALL**</span>
      university students nationwide!

      Look forward to free food all weekend, sponsor events, unforgettable
      activities, and of course, the chance
      to showcase **your own** project all in **24** hours!

      Now, all that's left for you to do is bring a laptop, friends, and some creativity.
      We'll handle the rest.

  - heading: 'PROJECT TO <span class="gradiented">PRIZES</span>'
    image: b
    body: |
      Assemble in teams of (up to) 4, and submit a project to one of many
      categories for the chance for your team to win a prize from our pool of
      goodies worth over <span class="gradiented">£4,500</span>!

      Each track sponsor will provide a problem statement, mixed in with some of our own.

      We can't wait to see you, your friends, and Warwick's most ingenious
      24-hour creations at WHACK. See you there!

  - heading: 'TOP <span class="gradiented">INDUSTRY</span> SPONSORS'
    image: c
    body: |
      **We're proud to be supported annually by top industry names**, and we’re looking for sponsors to join us in powering the next wave of tech talent!

      WHACK is the perfect opportunity for tech companies and startups to support talented students,
      and gain access into our pool of brilliant minds in STEM. There are also opportunities throughout
      the event to host talks and networking events. **We're still open to sponsors for WHACK 2025**, and we would be delighted to hear from you!

      For students, this is your opportunity to show off your technical skills, build connections with
      employers and use their industry-leading technologies!
