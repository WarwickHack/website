# Sponsors, grouped into tiers listed highest -> lowest.
#
# Tiers are keyed tier0, tier1, ... on purpose: the public-facing name
# (`label`) can change year to year without renaming keys or touching code.
# The template sizes tiers by their order in this list (first = largest).
#
# Expected shape:
#   tiers:
#     - id: tier0
#       label: <what visitors see, e.g. "Title Sponsor">
#       sponsors:
#         - id:    <unique slug, referenced by title_sponsor_id in site.yaml>
#           name:  <display name>
#           logo:  <filename in static/img/sponsors/, or "" for text>
#           url:   <link>
#           blurb: <optional paragraph, mainly for the higher tiers>

tiers: 
  - id: tier0
    label: "Gold Sponsor"
    highPriority: true
    sponsors:
      - id: 0
        name: "Marshall Wace"
        logo: static/img/sponsors/mwace.jpg
        url: https://www.mwam.com/about-us/
        blurb: "Temporary MWace Blurb"
      - id: 1
        name: "Sponsor 2"
        logo: static/img/sponsors/sponsor2.jpg
        url: www.bing.com
        blurb: "Temporary Blurb 2"
  - id: tier1
    label: "Silver Sponsor"
    highPriority: false
    sponsors:
      - id: 0
        name: "Bloomberg"
        logo: static/img/sponsors/bloomberg.jpg
        url: https://www.bloomberg.com/company/
        blurb: "Silver Blurb 1"