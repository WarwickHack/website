# Sponsors, grouped into tiers listed highest -> lowest.
#
# Tiers are keyed tier0, tier1, ... on purpose: the public-facing name
# (`label`) can change year to year without renaming keys or touching code.
# The template sizes tiers by their order in this list (first = largest).
#
# Expected shape:
#   tiers:
#     - id: tier0
#       label: <what visitors see, e.g. "Title Sponsor">
#       sponsors:
#         - id:    <unique slug, referenced by title_sponsor_id in site.yaml>
#           name:  <display name>
#           logo:  <filename in static/img/sponsors/, in the form img/sponsors/... or "" for text>
#           url:   <link>
#           blurb: <optional paragraph, mainly for the higher tiers>

# Note: Sponsor images are currently temporary/placeholders, pending official media.

tiers: 
  - id: tier0
    label: "Gold Sponsors"
    showBlurb: true
    sponsors:
      - id: marshall-wace
        name: "Marshall Wace"
        logo: img/sponsors/marshall-wace/logo.png
        url: https://www.mwam.com/
        blurb: |
          Marshall Wace is a leading global alternatives investment manager with around $85bn in assets under management, where technology, data and innovation are at the heart of how we solve complex problems and make decisions across global markets.
          We offer early careers opportunities through our Technology Internship Programme and Technology Graduate Programme. Our Internship Programme gives students hands-on engineering experience through real-world projects across areas such as software engineering, data engineering, infrastructure, DevOps, cyber security, AI-powered automation, trading systems and business intelligence. Our Graduate Programme is an 18–24 month rotational role across multiple engineering teams, including software development, data engineering and infrastructure, offering exposure to different technologies, development practices and business areas.

          Both programmes are designed for high-achieving students and graduates with strong technical and programming skills who are excited to solve complex problems in a fast-paced, collaborative environment.

          Internship roles: https://grnh.se/d4lsxs2a2us
          
          Graduate roles: https://grnh.se/pa7t00is2us

      - id: capital-one
        name: "Capital One"
        logo: img/sponsors/capital-one/logo.png
        url: https://www.capitalone.com/
        blurb: |
          We're on a mission: to change banking for good - one good thing at a time. You might think of us as a credit card company, but we're just as much a technology business.
          
          And we're here to make a positive difference - to our customers, our colleagues and society as a whole. Join us and you'll get to make a real and valued contribution to wide-ranging projects that have a meaningful impact on people's lives.
          
          You'll get great training and, as new doors open, there'll be no limits to what you can achieve. Just look at our CEO, Lucy Hagues, who started out on our Graduate Programme and now leads the UK business
      - id: incident-io
        name: "Incident.io"
        logo: img/sponsors/incident-io/logo.png
        url: https://incident.io/
        blurb: |
          incident.io is the single place you go when things go wrong - backed by a $62m Series B and trusted by companies like OpenAI, Lovable, and Netflix.
          We help engineering teams respond to and learn from incidents, minimise downtime, and focus on solving the problems that matter.
      - id: brevan-howard
        name: "Brevan Howard"
        logo: img/sponsors/brevan-howard/logo.png
        url: https://www.brevanhoward.com/
        blurb: |
         Founded in 2002, Brevan Howard is a leading global alternative investment management platform, specialising in global macro and digital assets.
         Our reputation, built up over nearly two decades, is founded on the quality of our exceptional people, our best-in-class technology and wide range of dynamic investment products offered within a rigorous institutional framework.
  - id: tier1
    label: "Silver Sponsors"
    showBlurb: true
    sponsors:
      - id: bloomberg
        name: "Bloomberg"
        logo: img/sponsors/bloomberg/logo.png
        url: https://www.bloomberg.com/company/what-we-do/
        blurb: |
          Bloomberg is a global information and technology company. We use our dynamic network of data, ideas and analysis to solve difficult problems. Our customers around the world rely on us to deliver accurate, real-time business and market information that helps them make important financial decisions.
          
          Life at Bloomberg is many things, but it’s never dull. We pride ourselves on being open, inclusive and collaborative — and in providing a work environment that inspires our employees to be their best. We’re proud to provide comprehensive healthcare coverage, as well as programs and services to help our employees and their families manage their health, wealth and well-being. We also have exciting perks including fitness and gym reimbursement, commuter savings programs and discounts on products and services.
      - id: netcraft
        name: "Netcraft"
        logo: img/sponsors/netcraft/logo.png
        url: https://www.netcraft.com/company/about-us
        blurb: Netcraft provides cybercrime disruption and internet data intelligence services, protecting organisations and users worldwide.